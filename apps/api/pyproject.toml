[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-cms-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "pymysql>=1.1,<2",
  "redis>=5,<7", "argon2-cffi>=23,<26", "PyJWT>=2.9,<3",
  "python-multipart>=0.0.20,<1", "Pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
