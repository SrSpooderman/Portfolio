services:
  nginx:
    volumes:
      - ./infra/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web-dev, backoffice-dev]
  api:
    volumes:
      - ./apps/api/src:/app/src
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*
  web-dev:
    image: node:22-alpine
    working_dir: /work
    volumes:
      - .:/work
      - web_node_modules:/work/node_modules
    command: sh -c "npm install && npm run dev -w @portfolio/web"
  backoffice-dev:
    image: node:22-alpine
    working_dir: /work
    volumes:
      - .:/work
      - backoffice_node_modules:/work/node_modules
    command: sh -c "npm install && npm run dev -w @portfolio/backoffice"
volumes:
  web_node_modules:
  backoffice_node_modules:
