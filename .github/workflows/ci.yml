name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "apps/api[test]"
      - run: python -m pytest -q
        env:
          DATABASE_URL: sqlite+pysqlite:///ci.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          REFRESH_TOKEN_PEPPER: ci-only-refresh-pepper-with-at-least-32-characters
          COOKIE_SECURE: "false"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -w @portfolio/backoffice
      - run: npm run build
      - run: npm run build:storybook -w @portfolio/backoffice
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @portfolio/backoffice
